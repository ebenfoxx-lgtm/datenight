<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night Invitation 🎬</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Bungee+Shade&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #ffdde1; --accent: #ff4d6d; }
        
        body {
            background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Varela Round', sans-serif;
            overflow: hidden; transition: background 0.6s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Floating Particles */
        .floating {
            position: absolute; pointer-events: none; z-index: 1;
            animation: rise 6s infinite ease-in; opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card Container */
        .container {
            text-align: center; background: rgba(255, 255, 255, 0.95); padding: 40px;
            border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            max-width: 450px; width: 90%; position: relative; z-index: 10;
            backdrop-filter: blur(10px); border: 4px solid rgba(255, 255, 255, 0.8);
            transition: height 0.3s ease;
        }

        .gif-display { width: 100%; height: 220px; border-radius: 20px; margin-bottom: 20px; object-fit: contain; }

        h1 { color: #d63384; font-size: 1.8rem; margin-bottom: 20px; min-height: 2.2rem; }
        .cursor { display: inline-block; width: 3px; background-color: #d63384; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* Button Container - Flexbox ensures they are side by side initially */
        .btn-wrapper {
            display: flex; 
            justify-content: center; 
            gap: 20px;
            min-height: 100px; 
            position: relative; 
            align-items: center;
            width: 100%;
        }

        button {
            padding: 15px 35px; font-size: 1.1rem; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            white-space: nowrap; /* Prevents text wrapping */
        }

        #yesBtn { 
            background: linear-gradient(45deg, #ff4d6d, #ff758c); color: white; 
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4); z-index: 100;
        }

        @keyframes jiggle {
            0% { transform: scale(var(--scale)) rotate(0deg); }
            25% { transform: scale(var(--scale)) rotate(-3deg); }
            75% { transform: scale(var(--scale)) rotate(3deg); }
        }
        .jiggling { animation: jiggle 0.3s infinite; }

        /* NO BUTTON - FIXED VISIBILITY */
        #noBtn { 
            background-color: white; 
            color: #d63384; 
            border: 2px solid #ff4d6d; 
            position: relative; /* Sit naturally in the flow first */
            z-index: 50; 
            min-width: 80px;
        }

        /* Form & Ticket */
        .ticket {
            background: #fff3b0; color: #333; padding: 20px;
            border: 2px dashed #d63384; border-radius: 10px;
            position: relative; margin-top: 20px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        input[type="text"] {
            width: 90%; padding: 12px; border-radius: 10px; border: 2px solid #ff4d6d;
            margin: 10px 0; font-family: inherit; text-align: center; font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: #d63384; box-shadow: 0 0 8px rgba(214, 51, 132, 0.3); }

        .whatsapp-btn {
            background: #25D366; color: white; padding: 12px 25px; 
            width: auto; margin-top: 10px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            10% { transform: scale(1.05); }
            20% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .genre-selector span { transition: transform 0.2s; display: inline-block; }
        .genre-selector span:hover { transform: scale(1.3) rotate(10deg); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="ask-screen">
            <img id="main-gif" class="gif-display" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3NjeTA5am53a2o0cHNsanlpa3dxZmZjbG00cm1meGRsY2xtbDkzNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zudini5kRNz0dTbV7M/giphy.gif">
            <h1 id="typewriter"></h1>
            <div class="btn-wrapper">
                <button id="yesBtn" style="--scale: 1">YES</button>
                <button id="noBtn">NO</button>
            </div>
        </div>

        <div id="movie-screen" class="hidden">
            <img class="gif-display" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExajNwb3Z5cW15azYxM2l3MWhuYTM1ZnJ4a2hiZ204eG56a2t6Y2w4aiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/KztT2c4u8mYYeFNKJ2/giphy.gif">
            <h1 style="font-family: 'Bungee Shade', cursive;">ADMIT ONE ✨</h1>
            <p>Pick the vibe:</p>
            <div class="genre-selector" style="display: flex; justify-content: space-around; margin-bottom: 15px;">
                <span style="cursor:pointer; font-size: 2.5rem;" onclick="setVibe('Rom-Com', '#ffafbd')" title="Romance">💖</span>
                <span style="cursor:pointer; font-size: 2.5rem;" onclick="setVibe('Action', '#ffc3a0')" title="Action">🍿</span>
                <span style="cursor:pointer; font-size: 2.5rem;" onclick="setVibe('Horror', '#a18cd1')" title="Horror">👻</span>
                <span style="cursor:pointer; font-size: 2.5rem;" onclick="setVibe('Disney', '#84fab0')" title="Disney">🏰</span>
            </div>

            <div id="booking-area" class="ticket hidden">
                <p id="genre-text" style="font-weight: bold; margin: 0; color: #d63384;"></p>
                <input type="text" id="movieInput" placeholder="Name of the movie..." required>
                <button onclick="sendWhatsApp()" class="whatsapp-btn">
                    <span>Send to Kwabena❤️</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const music = document.getElementById('bgMusic');
        let currentScale = 1;
        let selectedGenre = "";

        // 1. Particle System
        function createParticle() {
            const p = document.createElement('div');
            p.className = 'floating';
            p.innerHTML = ['🍿', '❤️', '✨', '🎬', '🎟️'][Math.floor(Math.random() * 5)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 20 + 10) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 5000);
        }
        setInterval(createParticle, 300);

        // 2. Typewriter Effect
        const text = "Me dɔ biako pɛ, will you watch a movie with me? 🥺";
        const typeContainer = document.getElementById("typewriter");
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                typeContainer.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
                i++;
                setTimeout(typeWriter, 100);
            }
        }
        window.onload = typeWriter;

        // 3. Evasive Button Logic (The Trap)
        function moveNoBtn() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            // Switch to fixed position so it can move anywhere
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            currentScale += 0.2;
            if(currentScale > 3) currentScale = 3;
            yesBtn.style.setProperty('--scale', currentScale);
            yesBtn.style.transform = `scale(${currentScale})`;
            yesBtn.classList.add('jiggling');
            
            // Sad Pleading GIF
            document.getElementById('main-gif').src = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWliYmNweTV5MGNqc3FkN21lZ3FtaGtmdHUzdjRzeTV1Z2JidHp5aSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/dCwNmR9BBOzKpiBQOs/giphy.gif";
        }

        noBtn.addEventListener('mouseover', moveNoBtn); 
        noBtn.addEventListener('click', moveNoBtn);     
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoBtn(); });

        // 4. Yes Button Logic
        yesBtn.addEventListener('click', () => {
            document.getElementById('ask-screen').classList.add('hidden');
            document.getElementById('movie-screen').classList.remove('hidden');
            music.play().catch(e => console.log("Audio requires interaction"));
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        });

        // 5. Genre Selection
        function setVibe(genre, color) {
            document.body.style.background = color;
            selectedGenre = genre;
            document.getElementById('genre-text').innerText = `Vibe: ${genre}`;
            document.getElementById('booking-area').classList.remove('hidden');
            confetti({ particleCount: 40, colors: [color, '#ffffff'] });
        }

        // 6. WhatsApp Logic
        function sendWhatsApp() {
            const movie = document.getElementById('movieInput').value;
            if (!movie) {
                alert("You gotta pick a movie first! 🎬");
                return;
            }
            
            const phoneNumber = "447909158386";
            const message = `Hey Kwabena❤️! 🍿\n\nI accept your movie date! 🎟️\n\nMood: ${selectedGenre}\nMovie: ${movie}\n\nSee you tonight! ❤️`;
            
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
            
            document.getElementById('booking-area').innerHTML = "<h3>Yay! Sent! 💌</h3><p>See you tonight!</p>";
            confetti({ particleCount: 500, spread: 300 });
        }
    </script>
</body>
</html>
